name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format demo-readiness changes on PR branch
        if: github.event_name == 'pull_request'
        run: |
          npx prettier --write src/app/CaseNotebook.tsx src/app/EduTooltip.tsx src/app/IncidentIntelPanel.tsx src/app/Layout.tsx src/app/LossRangeOverview.tsx src/app/MaterialityDashboard.tsx src/store/incidentStore.ts src/store/incidentStore.test.ts src/index.css DESIGN.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/CaseNotebook.tsx src/app/EduTooltip.tsx src/app/IncidentIntelPanel.tsx src/app/Layout.tsx src/app/LossRangeOverview.tsx src/app/MaterialityDashboard.tsx src/store/incidentStore.ts src/store/incidentStore.test.ts src/index.css DESIGN.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: format demo-readiness QA'
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
