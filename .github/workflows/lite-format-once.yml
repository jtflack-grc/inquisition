name: Temporary Lite feature formatting
on:
  push:
    branches:
      - feature/inquisition-lite-functional-workspace-20261031
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/LiteWorkspace.tsx src/app/WelcomePopup.tsx src/app/Layout.tsx src/app/MaterialityDashboard.tsx src/store/incidentStore.ts src/inquisition/liteScenario.ts src/inquisition/liteScenario.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/LiteWorkspace.tsx src/app/WelcomePopup.tsx src/app/Layout.tsx src/app/MaterialityDashboard.tsx src/store/incidentStore.ts src/inquisition/liteScenario.ts src/inquisition/liteScenario.test.ts
          if ! git diff --staged --quiet; then
            git commit -m "Apply repository formatting to functional INQUISITION Lite"
            git push origin HEAD:feature/inquisition-lite-functional-workspace-20261031
          fi
