name: Temporary Lite globe formatting
on:
  push:
    branches:
      - ux/lite-five-case-globe-20261031
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/ScenarioGlobe.tsx src/app/LiteWorkspace.tsx src/app/ScenarioGlobeFallback.tsx src/app/globeCaseSelection.ts src/app/globeCaseSelection.test.ts
      - name: Commit formatting once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ScenarioGlobe.tsx src/app/LiteWorkspace.tsx src/app/ScenarioGlobeFallback.tsx src/app/globeCaseSelection.ts src/app/globeCaseSelection.test.ts
          if ! git diff --staged --quiet; then
            git commit -m "Format Lite globe UI and reusable selection helper"
            git push origin HEAD:ux/lite-five-case-globe-20261031
          fi
