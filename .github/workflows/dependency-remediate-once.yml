name: Temporary dependency remediation
on:
  push:
    branches:
      - improve/model-cross-exam-tef-calibration-security-20261028
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply non-forced dependency remediation
        run: npm audit fix
      - name: Require no high or critical advisories
        run: npm audit --audit-level=high
      - name: Commit reviewed lockfile remediation to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh vulnerable locked dependencies without forcing majors"
            git push origin HEAD:improve/model-cross-exam-tef-calibration-security-20261028
          fi
