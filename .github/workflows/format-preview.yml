name: Format preview

on:
  push:
    branches: [feat/three-rail-visual-system]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/three-rail-visual-system
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write index.html src/app/ScenarioGlobe.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- index.html src/app/ScenarioGlobe.tsx; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/app/ScenarioGlobe.tsx
          git commit -m "Format Cesium case map"
          git push origin HEAD:feat/three-rail-visual-system
