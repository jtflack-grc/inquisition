name: Temporary guided-intro formatting
on:
  push:
    branches:
      - ux/first-run-guided-investigation-and-globe-occlusion-20261031
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: npx prettier --write src/index.css src/app/Layout.tsx src/app/MaterialityDashboard.tsx src/app/WelcomePopup.tsx src/app/guidedInvestigationsNavigation.ts
      - name: Commit formatting if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css src/app/Layout.tsx src/app/MaterialityDashboard.tsx src/app/WelcomePopup.tsx src/app/guidedInvestigationsNavigation.ts
          if ! git diff --staged --quiet; then
            git commit -m "Format guided first-run experience and opaque globe card"
            git push origin HEAD:ux/first-run-guided-investigation-and-globe-occlusion-20261031
          fi
