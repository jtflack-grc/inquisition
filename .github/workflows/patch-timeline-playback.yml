name: Patch timeline playback

on:
  push:
    branches:
      - feat/timeline-playback

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[timeline-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/timeline-playback
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch timeline controls into evidence rail and globe
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('src/app/IncidentIntelPanel.tsx')
          text = panel.read_text()
          old = 'import {\n  selectFilteredIncidents,\n  selectSelectedIncident,\n  useIncidentStore,\n} from "../store/incidentStore";\n'
          new = old + 'import { TimelinePlaybackControls } from "./TimelinePlaybackControls";\n'
          if 'TimelinePlaybackControls' not in text:
              if old not in text:
                  raise SystemExit('incident panel import anchor not found')
              text = text.replace(old, new, 1)
          anchor = '''                      <p className="text-[10px] text-war-muted/90 leading-relaxed">\n                        Human-readable milestones (not a minute-by-minute IR\n                        timeline). Compare gaps between intrusion narrative,\n                        public story, and issuer/regulator artifacts.\n                      </p>\n                      <ol className="space-y-2.5 list-decimal list-inside marker:text-sky-500/80">'''
          replacement = '''                      <p className="text-[10px] text-war-muted/90 leading-relaxed">\n                        Human-readable milestones (not a minute-by-minute IR\n                        timeline). Compare gaps between intrusion narrative,\n                        public story, and issuer/regulator artifacts.\n                      </p>\n                      <TimelinePlaybackControls incident={selected} />\n                      <ol className="space-y-2.5 list-decimal list-inside marker:text-sky-500/80">'''
          if '<TimelinePlaybackControls incident={selected} />' not in text:
              if anchor not in text:
                  raise SystemExit('timeline insertion anchor not found')
              text = text.replace(anchor, replacement, 1)
          panel.write_text(text)

          globe = Path('src/app/ScenarioGlobe.tsx')
          text = globe.read_text()
          incident_import = '''import {\n  selectSelectedIncident,\n  useIncidentStore,\n} from "../store/incidentStore";\n'''
          timeline_import = 'import { useTimelinePlaybackStore } from "../store/timelinePlaybackStore";\n'
          if timeline_import not in text:
              if incident_import not in text:
                  raise SystemExit('globe import anchor not found')
              text = text.replace(incident_import, incident_import + timeline_import, 1)

          selected_anchor = '''  const selected = useIncidentStore(selectSelectedIncident);\n\n  const containerRef = useRef<HTMLDivElement | null>(null);'''
          selected_replacement = '''  const selected = useIncidentStore(selectSelectedIncident);\n  const playbackIncidentId = useTimelinePlaybackStore((s) => s.incidentId);\n  const playbackStep = useTimelinePlaybackStore((s) => s.step);\n  const playbackPlaying = useTimelinePlaybackStore((s) => s.playing);\n  const playbackStepStartedAt = useTimelinePlaybackStore((s) => s.stepStartedAt);\n\n  const containerRef = useRef<HTMLDivElement | null>(null);'''
          if 'const playbackIncidentId' not in text:
              if selected_anchor not in text:
                  raise SystemExit('globe playback selector anchor not found')
              text = text.replace(selected_anchor, selected_replacement, 1)

          ref_anchor = '''  const clickHandlerRef = useRef<any>(null);\n  const [showPopup, setShowPopup] = useState(true);'''
          ref_replacement = '''  const clickHandlerRef = useRef<any>(null);\n  const lastCameraIncidentRef = useRef<string | null>(null);\n  const [showPopup, setShowPopup] = useState(true);'''
          if 'lastCameraIncidentRef' not in text:
              if ref_anchor not in text:
                  raise SystemExit('globe camera ref anchor not found')
              text = text.replace(ref_anchor, ref_replacement, 1)

          hover_anchor = '''  const hoveredIncident = useMemo(\n    () =>\n      incidents.find((incident) => incident.id === hoveredIncidentId) ?? null,\n    [hoveredIncidentId, incidents]\n  );\n\n  useEffect(() => {'''
          hover_replacement = '''  const hoveredIncident = useMemo(\n    () =>\n      incidents.find((incident) => incident.id === hoveredIncidentId) ?? null,\n    [hoveredIncidentId, incidents]\n  );\n\n  const playbackEvent = useMemo(() => {\n    if (!selected || playbackIncidentId !== selected.id || playbackStep == null) {\n      return null;\n    }\n    const timeline = selected.disclosureTimeline ?? [];\n    const event = timeline[playbackStep];\n    if (!event) return null;\n    return { event, index: playbackStep, total: timeline.length };\n  }, [playbackIncidentId, playbackStep, selected]);\n\n  useEffect(() => {'''
          if 'const playbackEvent = useMemo' not in text:
              if hover_anchor not in text:
                  raise SystemExit('globe playback memo anchor not found')
              text = text.replace(hover_anchor, hover_replacement, 1)

          point_old = '''          pixelSize: isSelected\n            ? new Cesium.CallbackProperty(() => {\n                const pulse = (Math.sin(Date.now() / 260) + 1) / 2;\n                return 11 + pulse * 6;\n              }, false)\n            : 7,'''
          point_new = '''          pixelSize: isSelected\n            ? new Cesium.CallbackProperty(() => {\n                const pulseDivisor = playbackEvent ? 180 : 260;\n                const pulse = (Math.sin(Date.now() / pulseDivisor) + 1) / 2;\n                return playbackEvent ? 14 + pulse * 8 : 11 + pulse * 6;\n              }, false)\n            : 7,'''
          if point_old in text:
              text = text.replace(point_old, point_new, 1)

          ring_old = '''    const selectedRed = Cesium.Color.fromCssColorString("#e06b6b");\n    for (const phaseOffset of [0, 0.5]) {\n      const radius = new Cesium.CallbackProperty(() => {\n        const phase = (((Date.now() / 1800 + phaseOffset) % 1) + 1) % 1;\n        return 55_000 + phase * 145_000;\n      }, false);\n      const ringColor = new Cesium.CallbackProperty(() => {\n        const phase = (((Date.now() / 1800 + phaseOffset) % 1) + 1) % 1;\n        return selectedRed.withAlpha(Math.max(0.06, 0.9 - phase * 0.84));\n      }, false);\n      const fillColor = new Cesium.CallbackProperty(() => {\n        const phase = (((Date.now() / 1800 + phaseOffset) % 1) + 1) % 1;\n        return selectedRed.withAlpha(Math.max(0.015, 0.13 - phase * 0.11));\n      }, false);'''
          ring_new = '''    const selectedRed = Cesium.Color.fromCssColorString("#e06b6b");\n    const selectedRingPeriod = playbackEvent ? 1350 : 1800;\n    for (const phaseOffset of [0, 0.5]) {\n      const radius = new Cesium.CallbackProperty(() => {\n        const phase = (((Date.now() / selectedRingPeriod + phaseOffset) % 1) + 1) % 1;\n        return playbackEvent ? 65_000 + phase * 185_000 : 55_000 + phase * 145_000;\n      }, false);\n      const ringColor = new Cesium.CallbackProperty(() => {\n        const phase = (((Date.now() / selectedRingPeriod + phaseOffset) % 1) + 1) % 1;\n        return selectedRed.withAlpha(Math.max(0.06, 0.9 - phase * 0.84));\n      }, false);\n      const fillColor = new Cesium.CallbackProperty(() => {\n        const phase = (((Date.now() / selectedRingPeriod + phaseOffset) % 1) + 1) % 1;\n        return selectedRed.withAlpha(Math.max(0.015, 0.13 - phase * 0.11));\n      }, false);'''
          if ring_old in text:
              text = text.replace(ring_old, ring_new, 1)

          one_shot_anchor = '''      selectedPulse.__inquisitionIncidentId = selected.id;\n    }\n\n    const countrySource = countrySourceRef.current;'''
          one_shot_replacement = '''      selectedPulse.__inquisitionIncidentId = selected.id;\n    }\n\n    if (playbackEvent) {\n      const eventRadius = new Cesium.CallbackProperty(() => {\n        const elapsed = Math.max(0, Date.now() - playbackStepStartedAt);\n        const phase = Math.min(1, elapsed / 1500);\n        return 75_000 + phase * 360_000;\n      }, false);\n      const eventOutline = new Cesium.CallbackProperty(() => {\n        const elapsed = Math.max(0, Date.now() - playbackStepStartedAt);\n        const phase = Math.min(1, elapsed / 1500);\n        return selectedRed.withAlpha(Math.max(0.03, 0.95 - phase * 0.92));\n      }, false);\n      const eventFill = new Cesium.CallbackProperty(() => {\n        const elapsed = Math.max(0, Date.now() - playbackStepStartedAt);\n        const phase = Math.min(1, elapsed / 1500);\n        return selectedRed.withAlpha(Math.max(0.005, 0.12 - phase * 0.115));\n      }, false);\n      const eventWave = viewer.entities.add({\n        position: Cesium.Cartesian3.fromDegrees(\n          selected.company.hqLon,\n          selected.company.hqLat\n        ),\n        ellipse: {\n          semiMajorAxis: eventRadius,\n          semiMinorAxis: eventRadius,\n          material: new Cesium.ColorMaterialProperty(eventFill),\n          outline: true,\n          outlineColor: eventOutline,\n          height: 0,\n          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,\n        },\n      });\n      eventWave.__inquisitionIncidentId = selected.id;\n    }\n\n    const countrySource = countrySourceRef.current;'''
          if 'const eventRadius = new Cesium.CallbackProperty' not in text:
              if one_shot_anchor not in text:
                  raise SystemExit('one-shot event ring anchor not found')
              text = text.replace(one_shot_anchor, one_shot_replacement, 1)

          country_alpha_old = '            ? Cesium.Color.fromCssColorString("#e06b6b").withAlpha(0.18)\n'
          country_alpha_new = '            ? Cesium.Color.fromCssColorString("#e06b6b").withAlpha(playbackEvent ? 0.24 : 0.18)\n'
          if country_alpha_old in text:
              text = text.replace(country_alpha_old, country_alpha_new, 1)

          camera_old = '''    setShowPopup(true);\n    viewer.camera.flyTo({\n      destination: Cesium.Cartesian3.fromDegrees(\n        selected.company.hqLon,\n        selected.company.hqLat,\n        10_500_000\n      ),\n      orientation: {\n        heading: Cesium.Math.toRadians(0),\n        pitch: Cesium.Math.toRadians(-90),\n        roll: 0,\n      },\n      duration: 1.4,\n    });\n  }, [hotspots, ready, selected, selectedId]);'''
          camera_new = '''    setShowPopup(!playbackEvent);\n    if (lastCameraIncidentRef.current !== selected.id) {\n      lastCameraIncidentRef.current = selected.id;\n      viewer.camera.flyTo({\n        destination: Cesium.Cartesian3.fromDegrees(\n          selected.company.hqLon,\n          selected.company.hqLat,\n          10_500_000\n        ),\n        orientation: {\n          heading: Cesium.Math.toRadians(0),\n          pitch: Cesium.Math.toRadians(-90),\n          roll: 0,\n        },\n        duration: 1.4,\n      });\n    }\n  }, [\n    hotspots,\n    playbackEvent,\n    playbackIncidentId,\n    playbackPlaying,\n    playbackStep,\n    playbackStepStartedAt,\n    ready,\n    selected,\n    selectedId,\n  ]);'''
          if camera_old not in text:
              raise SystemExit('camera dependency anchor not found')
          text = text.replace(camera_old, camera_new, 1)

          overlay_anchor = '''      {hoveredIncident && hoveredIncident.id !== selectedId && (\n        <div className="pointer-events-none absolute left-3 top-3 z-10 max-w-[260px] rounded border border-white/15 bg-black/80 px-3 py-2">\n          <div className="text-xs font-medium text-white">\n            {hoveredIncident.company.name}\n          </div>\n          <div className="mt-0.5 text-[10px] text-slate-400">\n            {hoveredIncident.incidentTitle}\n          </div>\n        </div>\n      )}\n\n      {showPopup && selected && globeLesson && ('''
          overlay_replacement = '''      {hoveredIncident && hoveredIncident.id !== selectedId && (\n        <div className="pointer-events-none absolute left-3 top-3 z-10 max-w-[260px] rounded border border-white/15 bg-black/80 px-3 py-2">\n          <div className="text-xs font-medium text-white">\n            {hoveredIncident.company.name}\n          </div>\n          <div className="mt-0.5 text-[10px] text-slate-400">\n            {hoveredIncident.incidentTitle}\n          </div>\n        </div>\n      )}\n\n      {playbackEvent && (\n        <div className="pointer-events-none absolute bottom-4 left-4 z-20 w-[min(28rem,calc(100%-2rem))] border border-rose-400/45 bg-black/90 px-4 py-3 shadow-2xl">\n          <div className="flex items-center justify-between gap-3 font-mono text-[9px] uppercase tracking-[0.14em] text-rose-300/85">\n            <span>Case replay · {playbackEvent.index + 1}/{playbackEvent.total}</span>\n            <span>{playbackPlaying ? "Playing" : "Paused"}</span>\n          </div>\n          <div className="mt-2 text-[10px] uppercase tracking-[0.12em] text-slate-400">\n            {playbackEvent.event.dateLabel}\n          </div>\n          <div className="mt-0.5 text-sm font-semibold text-white">\n            {playbackEvent.event.label}\n          </div>\n          {playbackEvent.event.detail && (\n            <p className="mt-1 text-[11px] leading-relaxed text-slate-300">\n              {playbackEvent.event.detail}\n            </p>\n          )}\n        </div>\n      )}\n\n      {showPopup && selected && globeLesson && ('''
          if 'Case replay · {playbackEvent.index + 1}' not in text:
              if overlay_anchor not in text:
                  raise SystemExit('playback overlay anchor not found')
              text = text.replace(overlay_anchor, overlay_replacement, 1)

          globe.write_text(text)
          PY
      - run: npm ci
      - run: npx prettier --write src/app/IncidentIntelPanel.tsx src/app/ScenarioGlobe.tsx src/app/TimelinePlaybackControls.tsx src/store/timelinePlaybackStore.ts
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Commit timeline playback
        run: |
          git config user.name "jtflack-grc"
          git config user.email "202126308+jtflack-grc@users.noreply.github.com"
          git add src/app/IncidentIntelPanel.tsx src/app/ScenarioGlobe.tsx src/app/TimelinePlaybackControls.tsx src/store/timelinePlaybackStore.ts
          git commit -m "Add linked incident timeline playback [timeline-patched]"
          git push origin HEAD:feat/timeline-playback
