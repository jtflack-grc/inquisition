name: Temporary guided UX formatting
on:
  push:
    branches:
      - ux/guided-cases-entry-and-header-cleanup-20261031
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format adjusted UI files
        run: npx prettier --write src/app/Layout.tsx src/app/MaterialityDashboard.tsx src/app/GoldenInvestigations.tsx src/app/WelcomePopup.tsx src/app/guidedInvestigationsNavigation.ts
      - name: Commit only style changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/Layout.tsx src/app/MaterialityDashboard.tsx src/app/GoldenInvestigations.tsx src/app/WelcomePopup.tsx src/app/guidedInvestigationsNavigation.ts
          if ! git diff --staged --quiet; then
            git commit -m "Format guided-case entry and streamlined header"
            git push origin HEAD:ux/guided-cases-entry-and-header-cleanup-20261031
          fi
