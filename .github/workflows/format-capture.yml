name: Temporary format capture
on:
  pull_request:
    branches: [main]
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Format changed sources and emit machine-readable contents
        run: |
          npx prettier --write src/app/AnnualExposureView.tsx src/app/FairFrequencySourceFacts.tsx src/app/FairNativeMaterialityPanel.tsx src/app/LossExceedanceView.tsx src/inquisition/lossExceedance.test.ts src/inquisition/lossExceedance.ts src/inquisition/materialityExportPayload.test.ts src/inquisition/materialityExportPayload.ts
          node -e 'for (const f of process.argv.slice(1)) console.log("FORMAT_BLOB:" + JSON.stringify({path:f,content:require("fs").readFileSync(f,"utf8")}))' src/app/AnnualExposureView.tsx src/app/FairFrequencySourceFacts.tsx src/app/FairNativeMaterialityPanel.tsx src/app/LossExceedanceView.tsx src/inquisition/lossExceedance.test.ts src/inquisition/lossExceedance.ts src/inquisition/materialityExportPayload.test.ts src/inquisition/materialityExportPayload.ts
