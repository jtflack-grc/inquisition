name: Selected incident pulse patch

on:
  push:
    branches:
      - fix/pulse-selected-incident

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pulse-selected-incident
      - run: python scripts/patch_selected_pulse.py
      - name: Commit patch
        run: |
          if git diff --quiet -- src/app/ScenarioGlobe.tsx; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ScenarioGlobe.tsx
          git commit -m "Pulse selected incident hotspot"
          git push origin HEAD:fix/pulse-selected-incident
