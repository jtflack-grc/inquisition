name: Temporary branch formatting
on:
  push:
    branches: [improve/model-cross-exam-tef-calibration-security-20261028]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format feature files
        run: npx prettier --write src/app/FairFrequencySourceFacts.tsx src/app/FairNativeMaterialityPanel.tsx src/app/MaterialityDashboard.tsx src/app/ModelCrossExamination.tsx src/app/TefCalibrationPanel.tsx src/inquisition/materialityExportPayload.ts src/inquisition/modelCrossExamination.ts src/inquisition/modelCrossExamination.test.ts src/inquisition/tefCalibration.ts src/inquisition/tefCalibration.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/FairFrequencySourceFacts.tsx src/app/FairNativeMaterialityPanel.tsx src/app/MaterialityDashboard.tsx src/app/ModelCrossExamination.tsx src/app/TefCalibrationPanel.tsx src/inquisition/materialityExportPayload.ts src/inquisition/modelCrossExamination.ts src/inquisition/modelCrossExamination.test.ts src/inquisition/tefCalibration.ts src/inquisition/tefCalibration.test.ts
          if ! git diff --staged --quiet; then
            git commit -m "Format cross-examination and TEF adapter"
            git push origin HEAD:improve/model-cross-exam-tef-calibration-security-20261028
          fi
